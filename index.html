<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Rápido de Campo - v2.0</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .badge-version {
      display: inline-block;
      background: #e6f4ea;
      color: #137333;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h2 {
      margin: 0 0 6px 0;
      color: #1e293b;
      font-size: 22px;
    }
    p.subtitle {
      margin: 0 0 20px 0;
      color: #64748b;
      font-size: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 10px;
      font-size: 14px;
    }
    /* Contenedor de Etiquetas (Chips) */
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      background-color: #f1f5f9;
      color: #334155;
      border: 2px solid #cbd5e1;
      border-radius: 24px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .chip:hover {
      background-color: #e2e8f0;
    }
    .chip.selected {
      background-color: #0d9488;
      color: #ffffff;
      border-color: #0f766e;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.35);
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      resize: vertical;
      min-height: 85px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #0d9488;
    }
    button.btn-submit {
      width: 100%;
      background-color: #0d9488;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button.btn-submit:hover {
      background-color: #0f766e;
    }
    button.btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #estado {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge-version">v2.0 • Actualizado desde GitHub</span>
    <h2>Ficha de Campo Rápida</h2>
    <p class="subtitle">Selecciona una o varias etiquetas para registrar el punto:</p>

    <label>1. Hallazgos / Tipo de Residuo:</label>
    <div class="chips-container" id="chipsContainer">
      <div class="chip" data-valor="Segrega bien">✅ Segrega bien</div>
      <div class="chip" data-valor="Plástico PET">♻️ Plástico PET</div>
      <div class="chip" data-valor="Cartón / Papel">📦 Cartón / Papel</div>
      <div class="chip" data-valor="Orgánicos">🌿 Orgánicos</div>
      <div class="chip" data-valor="No segregado">⚠️ No segregado</div>
      <div class="chip" data-valor="Casa cerrada">🚪 Casa cerrada</div>
    </div>

    <label for="observacion">2. Observación adicional (opcional):</label>
    <textarea id="observacion" placeholder="Ej. Jr. Ucayali cuadra 4, vecino participó..."></textarea>

    <button class="btn-submit" id="btnEnviar" onclick="enviarDatos()">Guardar Registro</button>
    <div id="estado"></div>
  </div>

  <script>
    // PEGA AQUÍ LA URL DE TU IMPLEMENTACIÓN DE APPS SCRIPT ("Puente app")
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwT0sncv3--mdClwhrQgNa3KyP5enIA6xXkuEzIZE2m/dev";

    // Lógica para activar/desactivar etiquetas al tocarlas
    const chips = document.querySelectorAll('.chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('selected');
      });
    });

    function enviarDatos() {
      const seleccionadas = Array.from(document.querySelectorAll('.chip.selected'))
                                 .map(el => el.getAttribute('data-valor'));
      const observacion = document.getElementById('observacion').value.trim();
      const estado = document.getElementById('estado');
      const btn = document.getElementById('btnEnviar');

      if (seleccionadas.length === 0 && observacion === "") {
        estado.style.color = "#dc2626";
        estado.textContent = "⚠️ Selecciona al menos una etiqueta o escribe una observación.";
        return;
      }

      // Unimos las etiquetas en texto separado por comas para enviarlo en el campo "qr"
      const textoEtiquetas = seleccionadas.length > 0 ? seleccionadas.join(", ") : "Sin etiquetas";

      btn.disabled = true;
      btn.textContent = "Enviando...";
      estado.style.color = "#0284c7";
      estado.textContent = "⏳ Guardando en Google Sheets...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          qr: textoEtiquetas,
          observacion: observacion
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          estado.style.color = "#16a34a";
          estado.textContent = "✅ ¡Registro guardado correctamente!";
          // Limpiar formulario tras guardar
          document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
          document.getElementById('observacion').value = "";
        } else {
          throw new Error(data.error || "Error desconocido");
        }
      })
      .catch(err => {
        estado.style.color = "#dc2626";
        estado.textContent = "❌ Error al enviar: " + err.message;
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "Guardar Registro";
      });
    }
  </script>

</body>
</html>
