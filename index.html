<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Campo Segura - v3.1 PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .badge-version {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h2 {
      margin: 0 0 6px 0;
      color: #1e293b;
      font-size: 22px;
    }
    p.subtitle {
      margin: 0 0 20px 0;
      color: #64748b;
      font-size: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #0d9488;
    }
    textarea {
      resize: vertical;
      min-height: 85px;
    }
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .chip {
      background-color: #f1f5f9;
      color: #334155;
      border: 2px solid #cbd5e1;
      border-radius: 24px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .chip.selected {
      background-color: #0d9488;
      color: #ffffff;
      border-color: #0f766e;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.35);
    }
    button.btn-submit {
      width: 100%;
      background-color: #0d9488;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button.btn-submit:hover {
      background-color: #0f766e;
    }
    button.btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .topbar-user {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #334155;
    }
    .btn-logout {
      background: none;
      border: none;
      color: #dc2626;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .status-msg {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: LOGIN -->
  <div class="card" id="loginCard">
    <span class="badge-version">v3.1 • App Instalable (PWA)</span>
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Ingresa tus credenciales autorizadas para registrar datos:</p>

    <label for="loginUser">Usuario:</label>
    <input type="text" id="loginUser" placeholder="Ej. luiggi" autocomplete="username">

    <label for="loginPass">Contraseña:</label>
    <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">

    <button class="btn-submit" id="btnLogin" onclick="iniciarSesion()">Ingresar</button>
    <div class="status-msg" id="loginEstado"></div>
  </div>

  <!-- PANTALLA 2: FORMULARIO DE REGISTRO (Oculto hasta validar) -->
  <div class="card hidden" id="appCard">
    <div class="topbar-user">
      <span>👤 Conectado: <strong id="usuarioActivoLabel"></strong></span>
      <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
    </div>

    <h2>Ficha de Campo Rápida</h2>
    <p class="subtitle">Selecciona una o varias etiquetas para registrar el punto:</p>

    <label>1. Hallazgos / Tipo de Residuo:</label>
    <div class="chips-container" id="chipsContainer">
      <div class="chip" data-valor="Segrega bien">✅ Segrega bien</div>
      <div class="chip" data-valor="Plástico PET">♻️ Plástico PET</div>
      <div class="chip" data-valor="Cartón / Papel">📦 Cartón / Papel</div>
      <div class="chip" data-valor="Orgánicos">🌿 Orgánicos</div>
      <div class="chip" data-valor="No segregado">⚠️ No segregado</div>
      <div class="chip" data-valor="Casa cerrada">🚪 Casa cerrada</div>
    </div>

    <label for="observacion">2. Observación adicional (opcional):</label>
    <textarea id="observacion" placeholder="Ej. Jr. Ucayali cuadra 4, vecino participó..."></textarea>

    <button class="btn-submit" id="btnEnviar" onclick="enviarDatos()">Guardar Registro</button>
    <div class="status-msg" id="estado"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzhJ9VjwiLT3TwN-bnCNp3vRbokyRFRdNfqa4SIbOIss2CblSoXUQ5UXEAJACTOSJt3LQ/exec";

    let sesionUsuario = "";
    let sesionClave = "";

    // Activar/desactivar etiquetas
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('selected'));
    });

    // Permitir entrar presionando Enter en la contraseña
    document.getElementById('loginPass').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') iniciarSesion();
    });

    function iniciarSesion() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const estado = document.getElementById('loginEstado');
      const btn = document.getElementById('btnLogin');

      if (!user || !pass) {
        estado.style.color = "#dc2626";
        estado.textContent = "⚠️ Ingresa usuario y contraseña.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Verificando...";
      estado.style.color = "#0284c7";
      estado.textContent = "🔐 Validando credenciales en servidor...";

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          accion: "login",
          usuario: user,
          clave: pass
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          sesionUsuario = user;
          sesionClave = pass;
          document.getElementById('usuarioActivoLabel').textContent = user;
          document.getElementById('loginCard').classList.add('hidden');
          document.getElementById('appCard').classList.remove('hidden');
          estado.textContent = "";
        } else {
          estado.style.color = "#dc2626";
          estado.textContent = "❌ " + (data.error || "Acceso denegado.");
        }
      })
      .catch(err => {
        estado.style.color = "#dc2626";
        estado.textContent = "❌ Error de red: " + err.message;
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "Ingresar";
      });
    }

    function cerrarSesion() {
      sesionUsuario = "";
      sesionClave = "";
      document.getElementById('loginUser').value = "";
      document.getElementById('loginPass').value = "";
      document.getElementById('estado').textContent = "";
      document.getElementById('appCard').classList.add('hidden');
      document.getElementById('loginCard').classList.remove('hidden');
    }

    function enviarDatos() {
      const seleccionadas = Array.from(document.querySelectorAll('.chip.selected'))
                                 .map(el => el.getAttribute('data-valor'));
      const observacion = document.getElementById('observacion').value.trim();
      const estado = document.getElementById('estado');
      const btn = document.getElementById('btnEnviar');

      if (seleccionadas.length === 0 && observacion === "") {
        estado.style.color = "#dc2626";
        estado.textContent = "⚠️ Selecciona al menos una etiqueta o escribe una observación.";
        return;
      }

      const textoEtiquetas = seleccionadas.length > 0 ? seleccionadas.join(", ") : "Sin etiquetas";

      btn.disabled = true;
      btn.textContent = "Enviando...";
      estado.style.color = "#0284c7";
      estado.textContent = "⏳ Guardando en Google Sheets...";

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          accion: "guardar",
          usuario: sesionUsuario,
          clave: sesionClave,
          qr: textoEtiquetas,
          observacion: observacion
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          estado.style.color = "#16a34a";
          estado.textContent = "✅ ¡Registro guardado por " + sesionUsuario + "!";
          document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
          document.getElementById('observacion').value = "";
        } else {
          estado.style.color = "#dc2626";
          estado.textContent = "❌ " + (data.error || "No autorizado.");
        }
      })
      .catch(err => {
        estado.style.color = "#dc2626";
        estado.textContent = "❌ Error al enviar: " + err.message;
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "Guardar Registro";
      });
    }

    // Registrar Service Worker para convertir la web en App Instalable (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA lista para instalar'))
          .catch(err => console.error('Error SW:', err));
      });
    }
  </script>

</body>
</html>
